services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rame
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di .env}
      POSTGRES_DB: rame
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rame -d rame"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://rame:${POSTGRES_PASSWORD}@db:5432/rame?schema=public"
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET wajib diisi di .env}
      # e.id — production: gateway.e.id (Login VC) + api-wallet.e.id (OAuth)
      EID_MODE: ${EID_MODE:-production}
      NEXT_PUBLIC_EID_MODE: ${EID_MODE:-production}
      EID_OAUTH_BASE_URL: ${EID_OAUTH_BASE_URL:-https://api-wallet.e.id}
      EID_OAUTH_CLIENT_ID: ${EID_OAUTH_CLIENT_ID:-}
      EID_OAUTH_CLIENT_SECRET: ${EID_OAUTH_CLIENT_SECRET:-}
      EID_OAUTH_CALLBACK_URL: ${EID_OAUTH_CALLBACK_URL:-}
      EID_VERIFIER_BASE_URL: ${EID_VERIFIER_BASE_URL:-https://gateway.e.id}
      EID_VERIFIER_CLIENT_ID: ${EID_VERIFIER_CLIENT_ID:-}
      EID_VERIFIER_CLIENT_SECRET: ${EID_VERIFIER_CLIENT_SECRET:-}
      EID_VERIFIER_VERIFICATION_ID: ${EID_VERIFIER_VERIFICATION_ID:-}
      EID_VERIFIER_WEBHOOK_URL: ${EID_VERIFIER_WEBHOOK_URL:-}
      EID_ISSUER_BASE_URL: ${EID_ISSUER_BASE_URL:-https://gateway.e.id}
      EID_ISSUER_CLIENT_ID: ${EID_ISSUER_CLIENT_ID:-}
      EID_ISSUER_CLIENT_SECRET: ${EID_ISSUER_CLIENT_SECRET:-}
      EID_WEBHOOK_SECRET: ${EID_WEBHOOK_SECRET:-}
      NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
      NEXT_PUBLIC_EID_ALLOW_DEMO_LOGIN: ${NEXT_PUBLIC_EID_ALLOW_DEMO_LOGIN:-false}
      SEED_ON_START: ${SEED_ON_START:-false}
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}
